releases:
  - version: "26.11"
    date: 2026-11-18
    markdown: |
      ### New Packages

      - Comet
      - diaTracer
      - MaxQuant
      - MSFragger
      - OpenTIMS
      - Percolator
      - ProteoWizard (msconvert only)
      - Sage (0.15 beta)

      ### New Python Packages

      - psims
      - serenipy
      - tdfextractor
      - tdfpy

      ### Updated Packages

      - OpenMS: 3.5.0 -> 3.6.0

        Note: Although OpenMS 3.6.0 supports direct reading of Thermo
        Raw files, this feature was disabled due to technical issues.
        However, it should be available in the next release.
