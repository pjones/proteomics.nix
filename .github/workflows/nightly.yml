name: "Nightly"

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily

jobs:
  openms-next-nightly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: "openms-next"}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with: { name: proteomics, skipPush: true }
      - run: |
            nix flake update
            nix build .#pyopenms --print-build-logs
