name: "Build Container"

on:
  pull_request:
    branches: [ "trunk" ]
    types: [ "opened", "synchronize", "reopened", "closed" ]

jobs:
  build-push-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with: { name: proteomics, skipPush: true }

      - name: Build Container
        run: nix build --print-build-logs .#container

      - name: Container Registry Login
        if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container to GHCR
        if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
        run: |
          docker image load < result
          docker tag proteomics.nix:latest ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proteomics.nix:latest
          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proteomics.nix:latest
