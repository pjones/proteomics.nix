name: "Build and Test"

on:
  pull_request:
    branches: [ "trunk" ]
    types: [ "opened", "synchronize", "reopened", "closed" ]
  push:
    branches: [ "trunk" ]
    tags:
      - 'v[0-9]+**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: proteomics
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: ${{ ! (github.event_name == 'pull_request'
                        && github.event.pull_request.merged) }}

      - name: OpenMS on macOS
        if: runner.os == 'macOS'
        run: nix build .#pyopenms --print-build-logs

      - name: Build Everything on Linux
        if: runner.os == 'Linux'
        run: nix flake check --print-build-logs

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with: { name: proteomics, skipPush: true }

      - name: Build Container
        run: nix build --print-build-logs .#container

      - name: Container Registry Login
        if: (github.event.action == 'closed' && github.event.pull_request.merged == true) || github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container to GHCR
        if: (github.event.action == 'closed' && github.event.pull_request.merged == true) || github.ref_type == 'tag'
        run: |
          docker image load < result

          set -x
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proteomics.nix"
          tags=("latest")

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags+=("$GITHUB_REF_NAME")
          fi

          for tag in "${tags[@]}"; do
            docker tag proteomics.nix:latest ${target}:${tag}
           done

          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proteomics.nix:latest

  publish:
    permissions: write-all
    needs: [ "build", "container" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          mkdir -p artifacts
          nix build .#changes --print-build-logs
          cp result/changes.md artifacts/

      - name: Publish Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: ${{ github.workspace }}/artifacts/changes.md
          make_latest: true
